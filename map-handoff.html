<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>지도앱 연결 · LOTBI</title>
  <link rel="stylesheet" href="site-theme-tokens.css?v=aset-df789249382b">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--lotbi-surface,#f7f8fb);color:var(--lotbi-text-primary,#17191d);font-family:system-ui,-apple-system,sans-serif}
    main{box-sizing:border-box;width:min(92vw,420px);padding:24px;border:1px solid var(--lotbi-border-default,#d9dde5);border-radius:20px;background:var(--lotbi-surface-elevated,#fff);box-shadow:0 12px 32px rgb(12 27 52/.12)}
    h1{margin:0 0 12px;font-size:1.25rem}p{line-height:1.6;color:var(--lotbi-text-secondary,#555)}
    a{display:block;margin-top:10px;text-align:center;padding:11px 16px;color:inherit}
    #launch{border-radius:12px;background:#142a4a;color:#fff;text-decoration:none;font-weight:700}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <p>LOTBI 장소검색</p>
    <h1 id="title">지도앱으로 연결할게요</h1>
    <p id="status" role="status" aria-live="polite">안전한 연결 주소를 확인하고 있어요.</p>
    <a id="launch" href="/" hidden>지도앱 열기</a>
    <a id="fallback" href="/" target="_blank" rel="noopener noreferrer" hidden>웹 지도에서 계속하기</a>
    <a href="/" rel="noopener">LOTBI로 돌아가기</a>
  </main>
  <script type="module" src="site-map-handoff.js?v=aset-df789249382b"></script>
</body>
</html>
