name: SITE-UNIVERSAL-LIFE-CALENDAR-01

on:
  pull_request:
    paths:
      - 'site-calendar.js'
      - 'site-calendar-actions.js'
      - 'site-conversation.js'
      - 'site-conversation.css'
      - 'site-calendar-ui.js'
      - 'site-calendar-manager.js'
      - 'site-calendar-model.js'
      - 'site-calendar-guest.js'
      - 'site-calendar.css'
      - 'site-calendar-weather.js'
      - 'site-calendar-public-weather.js'
      - 'scripts/validate_calendar_manual_weather_region_settings_01.mjs'
      - 'scripts/validate_calendar_weather_region_preference_01.mjs'
      - 'site-calendar-weather-region.js'
      - 'site-current-location.js'
      - 'scripts/validate_calendar_notification_settings_01.mjs'
      - 'scripts/validate_calendar_push_foundation_01.mjs'
      - 'scripts/validate_calendar_notification_permission_01.mjs'
      - 'lotbi-calendar-push-worker.js'
      - 'site-calendar-push.js'
      - 'site-calendar-notifications.js'
      - 'site-core.js'
      - 'site-auth.js'
      - 'site-continuity.js'
      - 'index.html'
      - 'auth/callback/index.html'
      - 'auth-callback.js'
      - 'scripts/validate_life_calendar_client_01.mjs'
      - 'scripts/validate_conversation_calendar_actions_01.mjs'
      - 'scripts/validate_life_calendar_ui_01.mjs'
      - 'scripts/validate_calendar_month_grid_01.mjs'
      - 'scripts/validate_calendar_year_view_01.mjs'
      - 'scripts/validate_guest_calendar_local_01.mjs'
      - 'scripts/validate_calendar_real_ui_01.mjs'
      - 'scripts/validate_calendar_weather_icons_01.mjs'
      - 'scripts/validate_calendar_guest_weather_client_01.mjs'
      - 'scripts/validate_calendar_korea_holidays_01.mjs'
      - 'scripts/validate_calendar_event_editor_01.mjs'
      - 'scripts/validate_calendar_responsive_01.mjs'
      - 'scripts/validate_calendar_modal_runtime_02.mjs'
      - 'scripts/validate_calendar_month_geometry_01.mjs'
      - 'scripts/validate_auth_continuity_02.mjs'
      - 'scripts/validate_site.py'
      - '.github/workflows/site-universal-life-calendar-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public Site static validation
        run: python scripts/validate_site.py
      - name: Existing Site auth continuity
        run: node scripts/validate_auth_continuity_02.mjs
      - name: Life Calendar client contract
        run: node scripts/validate_life_calendar_client_01.mjs
      - name: Conversation Calendar action state and idempotency
        run: |
          node --check site-calendar-actions.js
          node --check site-calendar.js
          node --check site-current-location.js
          node --check site-calendar-notifications.js
          node --check site-calendar-push.js
          node --check site-calendar-weather-region.js
          node --check lotbi-calendar-push-worker.js
          node --check site-conversation.js
          node scripts/validate_conversation_calendar_actions_01.mjs
      - name: Life Calendar UI prep contract
        run: node scripts/validate_life_calendar_ui_01.mjs
      - name: Real Calendar month and year model
        run: |
          node scripts/validate_calendar_month_grid_01.mjs
          node scripts/validate_calendar_year_view_01.mjs
      - name: Guest Calendar local repository
        run: node scripts/validate_guest_calendar_local_01.mjs
      - name: Real Calendar UI and editor
        run: |
          node scripts/validate_calendar_real_ui_01.mjs
          node scripts/validate_calendar_weather_icons_01.mjs
          node scripts/validate_calendar_guest_weather_client_01.mjs
          node scripts/validate_calendar_korea_holidays_01.mjs
          node scripts/validate_calendar_notification_permission_01.mjs
          node scripts/validate_calendar_push_foundation_01.mjs
          node scripts/validate_calendar_notification_settings_01.mjs
          node scripts/validate_calendar_weather_region_preference_01.mjs
          node scripts/validate_calendar_manual_weather_region_settings_01.mjs
          node scripts/validate_calendar_event_editor_01.mjs
          node scripts/validate_calendar_responsive_01.mjs
          node scripts/validate_calendar_modal_runtime_02.mjs
      - name: Calendar Month desktop geometry and density
        run: node scripts/validate_calendar_month_geometry_01.mjs
