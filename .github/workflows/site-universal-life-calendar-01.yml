name: SITE-UNIVERSAL-LIFE-CALENDAR-01

on:
  pull_request:
    paths:
      - 'site-calendar.js'
      - 'site-calendar-actions.js'
      - 'site-conversation.js'
      - 'site-conversation.css'
      - 'site-calendar-ui.js'
      - 'site-calendar-manager.js'
      - 'site-calendar-model.js'
      - 'site-calendar-product.js'
      - 'site-calendar-guest.js'
      - 'site-calendar.css'
      - 'site-calendar-weather.js'
      - 'site-calendar-expense.js'
      - 'site-calendar-expense.css'
      - 'site-calendar-public-weather.js'
      - 'site-current-location.js'
      - 'site-calendar-weather-region.js'
      - 'scripts/validate_calendar_notification_settings_01.mjs'
      - 'scripts/validate_calendar_push_foundation_01.mjs'
      - 'scripts/validate_calendar_notification_permission_01.mjs'
      - 'lotbi-calendar-push-worker.js'
      - 'site-calendar-push.js'
      - 'site-calendar-notifications.js'
      - 'site-core.js'
      - 'site-auth.js'
      - 'site-continuity.js'
      - 'index.html'
      - 'auth/callback/index.html'
      - 'auth-callback.js'
      - 'scripts/validate_life_calendar_client_01.mjs'
      - 'scripts/validate_conversation_calendar_actions_01.mjs'
      - 'scripts/validate_life_calendar_ui_01.mjs'
      - 'scripts/validate_calendar_month_grid_01.mjs'
      - 'scripts/validate_calendar_year_view_01.mjs'
      - 'scripts/validate_guest_calendar_local_01.mjs'
      - 'scripts/validate_calendar_real_ui_01.mjs'
      - 'scripts/validate_calendar_weather_icons_01.mjs'
      - 'scripts/validate_calendar_guest_weather_client_01.mjs'
      - 'scripts/validate_calendar_manual_weather_region_settings_01.mjs'
      - 'scripts/validate_calendar_weather_region_preference_01.mjs'
      - 'scripts/validate_calendar_korea_holidays_01.mjs'
      - 'scripts/validate_calendar_event_editor_01.mjs'
      - 'scripts/validate_calendar_responsive_01.mjs'
      - 'scripts/validate_calendar_modal_runtime_02.mjs'
      - 'scripts/validate_calendar_touch_monthnav_daysheet_01.mjs'
      - 'scripts/validate_calendar_day_panel_two_buttons_01.mjs'
      - 'scripts/validate_calendar_month_geometry_01.mjs'
      - 'scripts/validate_calendar_expense_summary_01.mjs'
      - 'scripts/validate_calendar_auxiliary_read_blast_radius_01.mjs'
      - 'scripts/validate_calendar_quiet_location_01.mjs'
      - 'scripts/validate_calendar_weather_region_province_01.mjs'
      - 'scripts/validate_calendar_holiday_surface_settings_icon_01.mjs'
      - 'scripts/validate_calendar_outside_month_01.mjs'
      - 'scripts/validate_calendar_editor_field_height_01.mjs'
      - 'scripts/validate_calendar_settings_expansion_01.mjs'
      - 'scripts/validate_calendar_secondary_surfaces_01.mjs'
      - 'scripts/validate_calendar_product_model_01.mjs'
      - 'scripts/validate_calendar_cross_platform_ux_01.mjs'
      - 'scripts/validate_calendar_compact_editor_01.mjs'
      - 'scripts/validate_calendar_system_dark_01.mjs'
      - 'scripts/generate_calendar_system_dark.mjs'
      - 'scripts/validate_calendar_add_from_image_01.mjs'
      - 'site-calendar-lunar.js'
      - 'scripts/validate_calendar_week_timegrid_model_01.mjs'
      - 'scripts/validate_calendar_week_timegrid_ui_01.mjs'
      - 'scripts/validate_calendar_lunar_model_01.mjs'
      - 'scripts/validate_calendar_lunar_settings_ui_01.mjs'
      - 'scripts/validate_calendar_toolbar_polish_01.mjs'
      - 'site-calendar-draft-write.js'
      - 'scripts/validate_conversation_calendar_auto_suggest_01.mjs'
      - 'scripts/validate_conversation_calendar_card_02.mjs'
      - 'scripts/validate_calendar_day_list_range_01.mjs'
      - 'scripts/validate_auth_continuity_02.mjs'
      - 'scripts/validate_site.py'
      - '.github/workflows/site-universal-life-calendar-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public Site static validation
        run: python scripts/validate_site.py
      - name: Existing Site auth continuity
        run: node scripts/validate_auth_continuity_02.mjs
      - name: Life Calendar client contract
        run: node scripts/validate_life_calendar_client_01.mjs
      - name: Conversation Calendar action state and idempotency
        run: |
          node --check site-calendar-actions.js
          node --check site-calendar.js
          node --check site-current-location.js
          node --check site-calendar-notifications.js
          node --check site-calendar-push.js
          node --check site-calendar-weather-region.js
          node --check lotbi-calendar-push-worker.js
          node --check site-conversation.js
          node scripts/validate_conversation_calendar_actions_01.mjs
      - name: Life Calendar UI prep contract
        run: node scripts/validate_life_calendar_ui_01.mjs
      - name: Real Calendar month and year model
        run: |
          node --check site-calendar-product.js
          node scripts/validate_calendar_month_grid_01.mjs
          node scripts/validate_calendar_year_view_01.mjs
          node scripts/validate_calendar_product_model_01.mjs
      - name: Guest Calendar local repository
        run: node scripts/validate_guest_calendar_local_01.mjs
      - name: Real Calendar UI and editor
        run: |
          node scripts/validate_calendar_real_ui_01.mjs
          node scripts/validate_calendar_weather_icons_01.mjs
          node scripts/validate_calendar_guest_weather_client_01.mjs
          node scripts/validate_calendar_korea_holidays_01.mjs
          node scripts/validate_calendar_notification_permission_01.mjs
          node scripts/validate_calendar_push_foundation_01.mjs
          node scripts/validate_calendar_notification_settings_01.mjs
          node scripts/validate_calendar_event_editor_01.mjs
          node scripts/validate_calendar_responsive_01.mjs
          node scripts/validate_calendar_modal_runtime_02.mjs
      - name: Calendar touch month navigation and selected-day sheet
        run: node scripts/validate_calendar_touch_monthnav_daysheet_01.mjs
      # 캘린더를 열었을 뿐인데 날짜 창이 저절로 떠 있지 않은지, 날짜를 누르면
      # 입력칸 없이 버튼 둘만 나오는지, [직접 등록]이 그 날짜로 전체 폼을 여는지를
      # 실제로 재서 확인한다. 접은 폴드(344px)와 다크모드까지 같은 기준으로 본다.
      - name: The day panel opens only when a date is pressed, and offers two buttons
        run: node scripts/validate_calendar_day_panel_two_buttons_01.mjs
      - name: Calendar Month desktop geometry and density
        run: node scripts/validate_calendar_month_geometry_01.mjs
      - name: Calendar expense summary strip
        run: |
          node --check site-calendar-expense.js
          node scripts/validate_calendar_expense_summary_01.mjs
          node scripts/validate_calendar_add_from_image_01.mjs
      # 대화창에 예약 이미지를 그냥 첨부했을 때의 경로. 캘린더 화면 버튼과 달리
      # 사용자가 기능을 알고 있을 필요가 없어야 하고, 관련 없는 사진에서는
      # 아무것도 묻지 않아야 하며, 같은 예약이 두 번 등록되면 안 된다.
      - name: Chat attachments offer the Calendar only when they fix a date
        run: |
          node --check site-calendar-draft-write.js
          node --check site-conversation.js
          node scripts/validate_conversation_calendar_auto_suggest_01.mjs
          node scripts/validate_conversation_calendar_card_02.mjs
          node scripts/validate_calendar_day_list_range_01.mjs
      - name: Auxiliary Calendar reads never tear the Calendar down
        run: node scripts/validate_calendar_auxiliary_read_blast_radius_01.mjs
      - name: Weather location stays quiet once it is settled
        run: node scripts/validate_calendar_quiet_location_01.mjs
      # 날씨 위치의 반복이 끝났는지: 허용된 권한이면 누르지 않아도 뜨고, 새로고침을
      # 넘기고, 미결정 상태에서는 어떤 팝업도 저절로 뜨지 않는다.
      - name: Weather location survives a reload, and asks for nothing on its own
        run: node scripts/validate_calendar_weather_region_province_01.mjs
      - name: Public holidays read as a day off, and Settings looks like Settings
        run: node scripts/validate_calendar_holiday_surface_settings_icon_01.mjs
      - name: Dates outside the month recede, and stay readable
        run: node scripts/validate_calendar_outside_month_01.mjs
      - name: Editor fields agree on height, and one setting cannot erase another
        run: node scripts/validate_calendar_editor_field_height_01.mjs
      - name: Grid lines and week start are settings, and the weekend stays on the weekend
        run: node scripts/validate_calendar_settings_expansion_01.mjs
      - name: Calendar secondary expense, settings, and cache surfaces
        run: |
          node scripts/validate_calendar_secondary_surfaces_01.mjs
          node scripts/validate_calendar_cross_platform_ux_01.mjs
          node scripts/validate_calendar_compact_editor_01.mjs
      - name: The default theme preference follows a dark OS, measured not asserted
        run: node scripts/validate_calendar_system_dark_01.mjs
      - name: Week is a real time-grid, not the former agenda list
        run: |
          node scripts/validate_calendar_week_timegrid_model_01.mjs
          node scripts/validate_calendar_week_timegrid_ui_01.mjs
      - name: 음력 (lunar date) display setting
        run: |
          node --check site-calendar-lunar.js
          node scripts/validate_calendar_lunar_model_01.mjs
          node scripts/validate_calendar_lunar_settings_ui_01.mjs
      - name: Toolbar visual polish keeps 44px targets and theme contrast
        run: node scripts/validate_calendar_toolbar_polish_01.mjs
