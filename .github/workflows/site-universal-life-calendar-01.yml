name: SITE-UNIVERSAL-LIFE-CALENDAR-01

on:
  pull_request:
    paths:
      - 'site-calendar.js'
      - 'site-core.js'
      - 'site-auth.js'
      - 'site-continuity.js'
      - 'index.html'
      - 'scripts/validate_life_calendar_client_01.mjs'
      - 'scripts/validate_auth_continuity_02.mjs'
      - 'scripts/validate_site.py'
      - '.github/workflows/site-universal-life-calendar-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public Site static validation
        run: python scripts/validate_site.py
      - name: Existing Site auth continuity
        run: node scripts/validate_auth_continuity_02.mjs
      - name: Life Calendar client contract
        run: node scripts/validate_life_calendar_client_01.mjs
