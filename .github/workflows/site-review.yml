name: Public Site Review Gate

on:
  push:
    branches:
      - site-public-02-review
      - site-home-chat-01-review
      - site-public-hardening-01-review
      - site-home-nav-01-review
      - site-mobile-entry-app-link-01-work
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate public site
        run: python scripts/validate_site.py

      - name: Validate conversational home navigation and input foundation
        run: python scripts/validate_home_chat.py

      - name: Validate public-site hardening
        run: python scripts/validate_hardening.py

      - name: Validate accessibility contracts
        run: python scripts/validate_accessibility.py

      - name: Validate mobile entry chooser contracts
        run: node scripts/validate_mobile_entry.js

      - name: Validate company philosophy page
        run: python scripts/validate_about.py

      - name: Static serving smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/lotbi-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lotbi-site-http.log || true
            exit 1
          fi

          for path in / /about.html /privacy.html /terms.html /account-deletion.html /contact.html /404.html /robots.txt /sitemap.xml /home-chat.css /site-hardening.css /home-shell.js /mobile-entry.css /mobile-entry.js /about.css; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done
