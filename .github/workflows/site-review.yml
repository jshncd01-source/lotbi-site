      # TRAFFIC-CCTV P0: 지역정보 → 실시간 도로 CCTV는 대화가 아니라 자체 선택 화면
      # (도로 → 노선 → 방향 → 구간 → CCTV, 위치·GPS 사용 없음, HTTPS 영상만 재생, 영상 닫으면 해제,
      # 뒤로가기 영상 → 목록 → 지역정보 → 홈, 저장한 지도앱 아이콘, 360~412px·데스크톱, 라이트·다크).
      - name: Validate traffic CCTV route selection
        run: node scripts/validate_traffic_cctv_route_select_p0_01.mjs

      # 진위확인 사진·스크린샷 선택은 카메라를 강제하지 않고(capture 없음),
      # 카메라로 촬영만 capture="environment"를 쓴다. 실제 Chrome 탭으로 각
      # 버튼이 자기 입력의 파일 선택 창을 여는지, 확인하기 전에는 전송되지
      # 않는지, 세로·가로·정사각형 사진과 긴 파일명 미리보기가 화면 안에
      # 들어오는지 375·390x844(라이트·다크)·412·데스크톱에서 확인하고,
      # 결론 배너 5단계의 글자 대비(WCAG AA)를 라이트·다크에서 잰다(실기기 아님).
      - name: Validate 진위확인 photo library, camera, preview and result banner
        run: |
          node scripts/validate_scam_shield_photo_picker_01.mjs
          node scripts/validate_scam_shield_result_banner_contrast_01.mjs

      # 로그인하지 않은 진위확인 로그인 안내의 로그인하고 확인하기·취소·× 글자와
      # 테두리 대비를 360/375/390/412/1280, 라이트·다크·시스템(전환 포함)에서
      # 보통·hover·눌림·포커스·비활성 상태로 재고, 취소·×·뒤로가기·로그인 동작과
      # 모바일 헤더 로그인 대비를 확인한다(실기기 아님).
      - name: Validate 진위확인 login gate buttons in light and dark
        run: node scripts/validate_scam_shield_login_gate_contrast_01.mjs

      # Core의 2단계 독립 확인 결과(요약 문장·2단계 확인 결과 3줄·공식 근거·
      # 접힌 경찰청 통계)를 실제 site-core 변환을 거쳐 그리는지, 정부(.go.kr/.or.kr)
      # https 페이지만 링크가 되는지, 옛 Core 응답·2단계 실패 응답도 그려지는지를
      # 390·1280, 라이트·다크에서 확인한다(WCAG AA, 실기기 아님).
      - name: Validate 진위확인 2단계 확인 결과
        run: node scripts/validate_scam_shield_double_check_p0.mjs

      # 사이트의 모든 파일 입력을 찾아 분류하고, 선택창을 띄우는 사진 입력은
      # accept="image/*" 하나(capture 없음)라서 안드로이드 Chromium 선택창에
      # 캠코더가 뜨지 않는지, 카메라 입력은 카메라로 바로 열리는지,
      # 문서 입력은 PDF를 유지하는지 SelectFileDialog 판단 규칙으로 확인한다(실기기 아님).
      - name: Validate photo inputs never offer the camcorder
        run: node scripts/validate_photo_input_no_camcorder_01.mjs

      # 다크·시스템다크 입력창 안 흰 사각형(텍스트칸 포커스 링) 0건과 둥근 입력창
      # 포커스 표시, 헤더 로그인·회원가입 대비·크기·겹침·이동, 답변 공유 메뉴의
      # 카카오톡 공유하기(첫 줄·보내는 내용 안내·탭 안 SDK 호출·실패 안내)와
      # 링크 복사를 320~412·Fold·1280, 라이트·다크·시스템에서 확인한다(실기기 아님).
      - name: Validate chat composer Dark, header auth buttons and KakaoTalk Share
        run: node scripts/validate_chat_dark_login_kakao_share_01.mjs

      - name: Validate Production Core CORS contract
        shell: bash
        run: |
          set -euo pipefail

          preflight() {
            local path="$1"
            local request_headers="$2"
            local request_method="$3"
            local headers body status origin methods allowed
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              --request OPTIONS "https://api.lotbiai.com${path}" \
              --header 'Origin: https://lotbiai.com' \
              --header "Access-Control-Request-Method: ${request_method}" \
              --header "Access-Control-Request-Headers: ${request_headers}")"
            [[ "$status" == '204' ]] || { echo "${path}: expected CORS 204, got $status" >&2; cat "$body" >&2; exit 1; }
            origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            methods="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-methods:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            allowed="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-headers:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            [[ "$origin" == 'https://lotbiai.com' ]] || { echo "${path}: unexpected ACAO '$origin'" >&2; exit 1; }
            grep -Eiq "(^|,)[[:space:]]*${request_method}([[:space:]]*,|$)" <<<"$methods" || { echo "${path}: ${request_method} missing from ACAM '$methods'" >&2; exit 1; }
            for required in ${request_headers//,/ }; do
              grep -Eiq "(^|,)[[:space:]]*${required}([[:space:]]*,|$)" <<<"$allowed" || { echo "${path}: $required missing from ACAH '$allowed'" >&2; exit 1; }
            done
          }

          preflight '/v2/conversation/messages' 'authorization,content-type' 'POST'
          preflight '/v2/conversation/guest/sessions' 'content-type' 'POST'
          preflight '/v2/conversation/guest/messages' 'content-type,idempotency-key,x-lotbi-guest-token' 'POST'
          preflight '/v2/product-resolutions/search' 'authorization,content-type' 'POST'
          preflight '/v2/product-resolutions/prs_smoke/cards' 'authorization' 'GET'
          preflight '/v2/product-resolutions/prs_smoke/review' 'authorization,content-type' 'POST'
          preflight '/v2/public/product-cards/search' '' 'GET'
          preflight '/v2/sessions/handoffs/redeem' 'content-type' 'POST'
          preflight '/v2/me' 'authorization' 'GET'
          preflight '/v2/sessions/logout' 'authorization' 'POST'

          evil_status="$(curl --silent --show-error --output /tmp/evil-body --write-out '%{http_code}' \
            --request OPTIONS 'https://api.lotbiai.com/v2/conversation/messages' \
            --header 'Origin: https://evil.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          [[ "$evil_status" == '403' ]] || { echo "evil origin expected 403, got $evil_status" >&2; cat /tmp/evil-body >&2; exit 1; }

          unauth_headers="$(mktemp)"
          unauth_status="$(curl --silent --show-error --output /tmp/unauth-body --dump-header "$unauth_headers" --write-out '%{http_code}' \
            --request POST 'https://api.lotbiai.com/v2/conversation/messages' \
            --header 'Origin: https://lotbiai.com' \
            --header 'Content-Type: application/json' \
            --data '{"text":"site-review-unauthenticated-probe"}')"
          [[ "$unauth_status" == '401' ]] || { echo "unauthenticated conversation expected 401, got $unauth_status" >&2; cat /tmp/unauth-body >&2; exit 1; }
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://lotbiai\.com' "$unauth_headers" || { echo 'unauthenticated response missing exact ACAO' >&2; exit 1; }

      - name: Static serving smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag lotbi-site-review .
          docker run --detach --rm --name lotbi-site-review --publish 127.0.0.1:4173:10000 lotbi-site-review
          trap 'docker logs lotbi-site-review 2>/dev/null || true; docker stop lotbi-site-review >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs lotbi-site-review || true
            exit 1
          fi

          for path in / /about /subscribe /refund /exchange /dispute /account-deletion /contact /terms /privacy /404.html /robots.txt /sitemap.xml /.well-known/apple-app-site-association /home-chat.css /home-bare-white.css /site-theme-tokens.css /site-hardening.css /site-avatar.css /site-avatar.js /assets/models/lotbi-faithful-v2-rigged.glb /assets/animations/lotbi-clips.v1.json /avatar-runtime/contracts/avatar-rig-controls.v2.json /avatar-runtime/runtime/controller.mjs /avatar-runtime/runtime/faithful-binding.mjs /avatar-runtime/vendor/three/three.module.js /avatar-runtime/vendor/three/addons/loaders/GLTFLoader.js /home-shell.js /mobile-entry.css /mobile-entry.js /about.css /site-conversation.css /site-conversation.js /site-kakao-share.js /site-chat-thinking.js /site-message-body.js /site-conversation-timeline.js /site-navigation.js /site-life-wallet.css /site-life-wallet.js /kakao-navi.html /site-kakao-navi-handoff.js /site-attachments.js /site-media-upload.js /site-media-upload-mock-core.js /site-media-upload-ui.js /site-media-upload.css /site-deterministic.js /site-continuity.js /site-auth.js /site-core.js /site-calendar.css /site-calendar-expense.css /site-calendar.js /site-calendar-expense.js /site-calendar-weather.js /site-calendar-actions.js /site-calendar-ui.js /site-calendar-manager.js /site-calendar-model.js /site-calendar-guest.js /site-pet.js /site-pet-ui.js /site-pet-guides.js /site-pet.css /site-festival.css /site-festival-client.js /site-festival-ui.js /site-current-location.js /site-bottom-sheet.js /auth-callback.js /auth/callback/ /auth/start/; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done

          for path in about subscribe refund exchange dispute account-deletion contact terms privacy; do
            for user_agent in 'LOTBI-Desktop-Test' 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) Mobile/15E148 Safari/604.1'; do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent "$user_agent" "http://127.0.0.1:4173/${path}")"
              [[ "$status" == '200' ]] || { echo "clean URL /${path} expected 200, got $status" >&2; exit 1; }
            done
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "http://127.0.0.1:4173/${path}.html?source=legacy")"
            [[ "$status" == '301' ]] || { echo "legacy URL /${path}.html expected 301, got $status" >&2; exit 1; }
            tr -d '\r' < "$headers" | grep --ignore-case --quiet "^Location: /${path}?source=legacy$" || { echo "legacy URL /${path}.html lost clean target or query" >&2; cat "$headers" >&2; exit 1; }
          done

          root_fixture="$(mktemp)"
          app_open_exact_fixture="$(mktemp)"
          app_open_root_fixture="$(mktemp)"
          app_open_nested_fixture="$(mktemp)"
          curl --fail --silent --show-error 'http://127.0.0.1:4173/' --output "$root_fixture"
          curl --fail --silent --show-error 'http://127.0.0.1:4173/app/open' --output "$app_open_exact_fixture"
          curl --fail --silent --show-error 'http://127.0.0.1:4173/app/open/?next=a%2Fb%3Fc%3D1' --output "$app_open_root_fixture"
          curl --fail --silent --show-error 'http://127.0.0.1:4173/app/open/product/123?ref=kakao&encoded=%252F' --output "$app_open_nested_fixture"
          cmp "$root_fixture" "$app_open_exact_fixture"
          cmp "$root_fixture" "$app_open_root_fixture"
          cmp "$root_fixture" "$app_open_nested_fixture"

          curl --fail --silent --show-error --head 'http://127.0.0.1:4173/.well-known/apple-app-site-association' \
            | tr -d '\r' | grep --ignore-case --quiet '^Content-Type: application/json'
          for path in /avatar-runtime/runtime/controller.mjs '/avatar-runtime/runtime/faithful-binding.mjs?v=smoke' /avatar-runtime/runtime/refinement.mjs /site-avatar.js; do
            curl --fail --silent --show-error --head "http://127.0.0.1:4173${path}" \
              | tr -d '\r' | grep --ignore-case --quiet --extended-regexp '^Content-Type: (application|text)/javascript' \
              || { echo "module script ${path} must be served as JavaScript" >&2; exit 1; }
          done
          unknown_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/not-a-real-static-path')"
          [[ "$unknown_status" == '404' ]] || { echo "unrelated static path must remain 404, got $unknown_status" >&2; exit 1; }

          callback_url="$(curl --silent --show-error --location --output /dev/null --write-out '%{url_effective}' 'http://127.0.0.1:4173/auth/callback?code=ccccccccccccccccccccccccccccccccccccccccccc&state=sssssssssssssssssssssssssssssssssssssssssss')"
          [[ "$callback_url" == *'/auth/callback/?code='*'&state='* ]] || { echo "callback redirect did not preserve code/state query: $callback_url" >&2; exit 1; }

          # AUTH-SESSION-CONTINUITY-P0-02 — documents revalidate, login callback/start are never stored, assets unchanged.
          cache_control() { curl --silent --show-error --head "http://127.0.0.1:4173$1" | tr -d '\r' | awk 'tolower($1)=="cache-control:"{print $2}'; }
          for path in '/auth/callback/' '/auth/callback/?code=ccccccccccccccccccccccccccccccccccccccccccc&state=sssssssssssssssssssssssssssssssssssssssssss' '/auth/start/'; do
            [[ "$(cache_control "$path")" == 'no-store' ]] || { echo "${path} must be Cache-Control: no-store" >&2; exit 1; }
          done
          for path in '/' '/index.html' '/terms' '/site-asset-version.json'; do
            [[ "$(cache_control "$path")" == 'no-cache' ]] || { echo "${path} must be Cache-Control: no-cache" >&2; exit 1; }
          done
          [[ -z "$(cache_control '/site-auth.js')" ]] || { echo "versioned scripts keep their caching" >&2; exit 1; }
