name: Public Site Review Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-static-site:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deterministic asset cache coherence
        run: node scripts/asset_cache_version.mjs --check

      - name: Validate same-URL Home first-paint stability
        run: node scripts/validate_home_same_url_stability_01.mjs

      - name: Validate public site
        run: python scripts/validate_site.py

      - name: Validate UI/UX Phase 1 contracts
        run: node scripts/validate_uiux_phase1_01.mjs

      - name: Validate footer business information is identical across pages
        run: python scripts/sync_footer_business_info.py --check

      # Run feature-owned profile regressions before unrelated Site gates so
      # active logo/main work cannot hide whether this branch is executable.
      - name: Validate conversation, profile and thread UX contracts
        run: node scripts/validate_conversation_sidebar_ux_01.mjs

      - name: Validate PHASE 10 conversation management
        run: node scripts/validate_conversation_management_10.mjs

      - name: Validate same-page profile menu runtime
        run: node scripts/validate_profile_menu_improvement_01.mjs

      # The account row is now the only profile entry point. Guard the removals
      # and, more importantly, that every item it absorbed is still reachable.
      # 계정 전역 식별자는 계정 페이지가 주인입니다. 프로필 화면에서는 빼되,
      # 가는 길('설정' → 계정 페이지)은 반드시 남아 있어야 합니다.
      - name: Validate profile handle belongs to the account page
        run: node scripts/validate_profile_handle_to_account_01.mjs

      - name: Validate single profile entry point
        run: node scripts/validate_single_profile_entry_01.mjs

      # 프로필 메뉴는 여섯 항목 그대로여야 하고, 개인테마 창에는 테마만,
      # 프로필 창에는 계정 관리 버튼이 없어야 한다.
      - name: Validate 개인테마 profile menu
        run: node scripts/validate_profile_menu_personal_theme_01.mjs

      # '자동모드' follows the clock (18시 다크 · 07시 라이트) and must never
      # leak 'auto' into the attribute the theme tokens style.
      - name: Validate 자동모드 theme schedule
        run: node scripts/validate_theme_auto_schedule_02.mjs

      - name: Validate canonical email-first identity profile
        run: node scripts/validate_identity_profile_hotfix_02.mjs

      # Run the feature-owned profile regression before unrelated Site gates so
      # active logo/main work cannot hide whether this branch is executable.

      - name: Validate conversational home shell
        run: python scripts/validate_home_chat.py

      - name: Validate official LOTBI logo wiring
        run: node scripts/validate_brand_official_logo_01.mjs

      # The wordmark has to follow the LOTBI theme switch, not just the OS,
      # and stay off the always-light pages.
      - name: Validate theme-aware brand logo
        run: node scripts/validate_brand_logo_theme_aware_01.mjs

      # The dark wordmark's letter counters must stay open. The theme wiring
      # above only decides which artwork is shown; this decides whether that
      # artwork still reads as L-O-T-B-I once it is on #151922.
      - name: Validate dark wordmark counters
        run: node scripts/validate_dark_wordmark_counters_01.mjs

      # The recent-conversation list is read in Dark too, selected row included.
      - name: Validate dark conversation list contrast
        run: node scripts/validate_dark_conversation_list_contrast_01.mjs

      # The controls that used to paint themselves with the raw brand navy must
      # follow a token that has a Dark form, and every token must be declared on
      # all four theme paths rather than just one.
      - name: Validate dark brand surfaces
        run: node scripts/validate_dark_brand_surfaces_01.mjs

      # Shared form controls must not trip iOS Safari's focus zoom, and the
      # viewport must stay pinch-zoomable.
      - name: Validate iOS input zoom
        run: node scripts/validate_ios_input_zoom_01.mjs

      # The drawer and sidebar surfaces must be painted by both theme paths, not
      # only by the Home-scoped skin.
      - name: Validate dark drawer surface
        run: node scripts/validate_dark_drawer_surface_01.mjs

      # The theme has to be on the document before the first paint, or Dark
      # reloads flash white.
      - name: Validate theme bootstrap first paint
        run: node scripts/validate_theme_bootstrap_first_paint_01.mjs

      # The first paint is only half of it: the module must not then reset the
      # theme to 'system' when a namespace has no stored preference.
      - name: Validate theme carry across namespaces
        run: node scripts/validate_theme_namespace_carry_01.mjs

      # Following a footer link must not walk the reader out of Dark: the
      # static pages carried no theme code at all.
      - name: Validate static pages theme
        run: node scripts/validate_static_pages_theme_01.mjs

      # The viewport-sized scroll container must not be a tab stop: its focus
      # ring reached the screen as two blue vertical lines.
      - name: Validate container focus ring
        run: node scripts/validate_focus_ring_container_01.mjs

      # A long answer keeps growing after it is appended; the thread has to
      # follow it without dragging a reader who scrolled up.
      - name: Validate answer scroll and markdown
        run: node scripts/validate_answer_scroll_markdown_01.mjs

      # 대표님: "스크롤해도 상단바가 따라오게 해". The bar has to ride the
      # conversation scroller AND cost the thread no height while doing it —
      # `fixed` would pass the first half and eat the second on a short screen.
      - name: Validate sticky Home top bar
        run: node scripts/validate_sticky_topbar_01.mjs

      - name: Validate shared bottom sheet primitive
        run: node scripts/validate_bottom_sheet_primitive_01.mjs

      # 대표님: "유한회사 알에이디홀딩스 사업자번호만 나오게 하고, 거길 클릭하면
      # 아래에서 슬라이드로 올라오게 바꿔." 모바일 푸터를 한 줄로 접되, 전자상거래법
      # 제10조제1항 표시사항은 한 항목도 빠지지 않고 시트 안에 있어야 한다 —
      # 접는 것과 지우는 것은 다르다. 넓은 화면은 접지 않는다.
      - name: Validate mobile footer legal sheet
        run: node scripts/validate_mobile_footer_legal_sheet_01.mjs

      - name: Validate Bare White Home skin scope
        run: python scripts/validate_bare_white_home_skin_01.py

      - name: Render Bare White Home desktop/mobile evidence
        env:
          BARE_WHITE_EVIDENCE_DIR: ${{ runner.temp }}/bare-white-home
        run: node scripts/validate_bare_white_home_render_01.mjs

      - name: Upload Bare White Home render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bare-white-home-render-${{ github.sha }}
          path: ${{ runner.temp }}/bare-white-home
          if-no-files-found: error
          retention-days: 30

      - name: Validate mobile Home keyboard and Avatar stability
        run: node scripts/validate_mobile_home_ux_stability_01.mjs

      - name: Validate persisted conversation Avatar first-paint restore
        run: node scripts/validate_avatar_refresh_flash_01.mjs

      - name: Validate sealed 3D Avatar Site integration
        run: node scripts/validate_site_avatar_integration.mjs

      - name: Validate terminal Avatar fallback in browser
        run: node scripts/validate_site_avatar_fallback_runtime.mjs

      - name: Validate Sidebar information architecture
        run: node scripts/validate_sidebar_information_architecture_04.mjs

      - name: Validate blank Home refresh persistence
        run: node scripts/validate_home_refresh_persistence_01.mjs

      # Entering the site starts a new conversation; reloading the same tab
      # still restores the one that was open.
      - name: Validate fresh entry versus same-tab refresh
        run: node scripts/validate_home_fresh_entry_01.mjs

      - name: Validate Sidebar desktop/mobile viewport rendering
        run: node scripts/validate_sidebar_viewports_04.mjs

      - name: Validate live conversation and handoff contracts
        run: node scripts/validate_conversation_integration.mjs

      - name: Validate Conversation to Calendar actions
        run: |
          node --check site-calendar-actions.js
          node --check site-calendar.js
          node --check site-conversation.js
          node scripts/validate_conversation_calendar_actions_01.mjs
          node scripts/validate_life_calendar_client_01.mjs
          node scripts/validate_calendar_weather_icons_01.mjs
          node scripts/validate_guest_calendar_local_01.mjs
          node --check site-calendar-expense.js
          node scripts/validate_calendar_expense_summary_01.mjs
          node scripts/validate_calendar_auxiliary_read_blast_radius_01.mjs
          node scripts/validate_calendar_quiet_location_01.mjs
          node scripts/validate_calendar_weather_region_province_01.mjs
          node scripts/validate_calendar_holiday_surface_settings_icon_01.mjs
          node scripts/validate_calendar_outside_month_01.mjs
          node scripts/validate_calendar_editor_field_height_01.mjs
          node scripts/validate_calendar_settings_expansion_01.mjs
          node scripts/validate_calendar_system_dark_01.mjs
          node scripts/validate_calendar_add_from_image_01.mjs
          node --check site-calendar-draft-write.js
          node scripts/validate_conversation_calendar_auto_suggest_01.mjs
          node scripts/validate_conversation_calendar_card_02.mjs
          node scripts/validate_calendar_day_list_range_01.mjs

      - name: Validate voice wake phrase matching
        run: |
          node --check site-voice-wake.js
          node --check site-conversation.js
          node scripts/validate_voice_wake_phrase_match_01.mjs

      - name: Validate Universal Rich Product Cards
        run: |
          node --check site-core.js
          node --check site-conversation.js
          node --check site-message-body.js
          node scripts/validate_rich_product_cards_01.mjs

      - name: Validate NAVER Maps place navigation
        run: |
          node --check site-navigation.js
          node scripts/validate_naver_maps_navigation_01.mjs

      # 대표님이 실제 맛집 카드를 보시고 지시하신 네 가지 — 카드 크기, 지도
      # 썸네일과 "위치" 삭제, "전화"·"네이버지도" 글자 삭제, 인허가 문구 축약.
      # 줄었다는 것은 숫자라서 소스가 아니라 렌더된 카드를 실제로 잰다. 줄이기
      # 전 카드는 레일보다 52~62px 높아 동작 버튼이 잘려 있었고, 그것은 소스만
      # 봐서는 보이지 않는 결함이었다.
      - name: Validate compact Place Card
        run: node scripts/validate_place_card_compact_01.mjs

      # 대표님 지시로 길찾기가 딥링크 3종이 되었습니다 — 네이버 옆에 카카오맵과
      # 티맵. 새 API 키도 과금도 없고 URL scheme 과 Android intent 뿐입니다.
      # 티맵은 x 가 경도 y 가 위도라 순서를 뒤집으면 엉뚱한 곳으로 보내므로
      # 좌표 순서를 문자열로 못 박고, 좌표가 확인되지 않은 장소는 이름 검색으로
      # 떨어지는지도 봅니다. 버튼이 넷이 되어 카드가 깨지지 않는지는 412·390·
      # 360px 에서 실제로 잽니다.
      - name: Validate Place Card map deep links
        run: node scripts/validate_place_card_map_deeplinks_01.mjs

      - name: Validate cross-platform Place Card product contract
        run: node scripts/validate_place_card_cross_platform_01.mjs

      - name: Validate LOTBI Box navigation and saved surface
        run: node scripts/validate_lotbi_box_nav_01.mjs

      # FESTIVAL-EVENT-08: consumer 축제 detail/program screen — real Core
      # snake_case normalization, PUBLISHED-only boundary, CTA visibility,
      # date-tab grouping and KST weekday, legacy-section removal, and nav
      # wiring/external-link hygiene. FESTIVAL-EVENT-09's venue-coordinate
      # program-date weather (site-festival-weather.js) is folded into the
      # same date tabs. FESTIVAL-EVENT-10 adds "내 캘린더에 추가" (visit-date
      # picker -> the existing LOTBI Calendar) and Calendar -> Festival
      # re-entry. (FESTIVAL-07's browse UI shipped these scripts in PR #322
      # without ever wiring them into this gate; this closes that gap.)
      - name: Validate 축제·행사 public boundary, detail/program screen, weather, and Calendar link
        run: |
          node --check site-festival-client.js
          node --check site-festival-ui.js
          node --check site-festival-weather.js
          node --check site-festival-calendar.js
          node --check site-calendar-guest.js
          node --check site-calendar-manager.js
          node --check site-conversation.js
          node scripts/validate_festival_public_boundary_01.mjs
          node scripts/validate_festival_nav_wiring_01.mjs
          node scripts/validate_festival_event_08_detail_01.mjs
          node scripts/validate_festival_event_08_responsive_a11y_01.mjs
          node scripts/validate_festival_weather_01.mjs
          node scripts/validate_festival_calendar_link_01.mjs
          node scripts/validate_festival_calendar_add_ui_01.mjs

      - name: Validate PET FAMILY web surface
        run: |
          node --check site-pet.js
          node --check site-pet-ui.js
          node --check site-pet-guides.js
          node scripts/validate_pet_family_web_01.mjs
          node scripts/validate_pet_family_v2_registration_01.mjs
          node scripts/validate_pet_family_v2_profile_match_01.mjs

      # 강아지·고양이가 아니면 등록되지 않는다. Core refuses the photo; this
      # guards that the refusal reaches the owner with a next step attached,
      # and that the screen's own quick look stays slacker than Core's so it
      # never blocks a photo Core would have taken.
      - name: Validate PET species gate web surface
        run: node scripts/validate_pet_species_gate_web_01.mjs


      - name: Validate user bubble content-fit rendering
        run: node scripts/validate_user_bubble_content_fit.mjs

      - name: Validate conversation message UX finalization
        env:
          REQUIRE_BROWSER: 1
        run: node scripts/validate_conversation_message_ux_final_01.mjs

      # 소셜 로그인 세션은 Core 가 FEDERATED_LIMITED 로 발급한다. Site 의 응답
      # 계약이 'FULL' 만 비교해 로그인이 깨진 적이 있다. 테스트 스텁이 전부
      # 'FULL' 이라 CI 가 잡지 못했다 — 이 게이트가 그 빈칸이다.
      - name: Validate Site normal consumer assurance contract
        run: node scripts/validate_site_normal_assurance_01.mjs

      - name: Validate authenticated return and refresh continuity
        run: node scripts/validate_auth_continuity_02.mjs

      - name: Validate composer send and voice interaction
        run: node scripts/validate_composer_interaction.mjs

      # 복사하기/공유하기 ride under every LOTBI answer. Guard that share stays
      # on the OS share sheet — no Kakao SDK, no app key, no extra page script.
      - name: Validate message copy and share actions
        run: node scripts/validate_message_share_actions_01.mjs

      - name: Validate reusable output cards
        run: node scripts/validate_reusable_output_card_01.mjs

      - name: Validate attachment API and file safety contracts
        run: |
          node scripts/validate_attachment_api_01.mjs
          node scripts/validate_attachment_files_01.mjs

      - name: Validate chat layout and attachment composer
        env:
          REQUIRE_BROWSER: 1
        run: node scripts/validate_chat_layout_attachment_01.mjs

      - name: Validate PHASE 16 attachment file preflight
        run: node scripts/validate_attachment_files_16.mjs

      - name: Validate PHASE 16 attachment Core API contract
        run: node scripts/validate_attachment_api_16.mjs

      - name: Validate PHASE 16 attachment composer
        run: node scripts/validate_attachment_composer_16.mjs

      # 사진을 첨부하면 "[파일] 21930.jpg" 가 아니라 실제 썸네일이 보여야 합니다.
      # 업로드·AI 이미지 분석·Calendar 후보 경로는 그대로 유지합니다.
      - name: Validate image attachment thumbnails
        env:
          REQUIRE_BROWSER: 1
        run: node scripts/validate_image_attachment_thumbnail_01.mjs

      - name: Validate chat attachment privacy and Running LOTBI thinking UX
        run: node scripts/validate_chat_media_thinking_01.mjs

      - name: Validate centered conversation timeline
        run: node scripts/validate_conversation_timeline_01.mjs

      - name: Validate response grade selector
        run: node scripts/validate_response_grade_selector_01.mjs

      - name: Validate composer auto-grow interaction
        run: node scripts/validate_composer_auto_grow.mjs

      - name: Validate public-site hardening
        run: python scripts/validate_hardening.py

      - name: Validate accessibility contracts
        run: python scripts/validate_accessibility.py

      - name: Validate global Dark Theme semantic contrast
        run: node scripts/validate_global_dark_theme_contrast.mjs

      - name: Validate Home small-text contrast
        run: node scripts/validate_home_small_text_contrast_01.mjs

      - name: Validate mobile entry chooser contracts
        run: node scripts/validate_mobile_entry.js

      - name: Validate Apple App Link association source
        run: python scripts/validate_apple_app_site_association.py

      - name: Validate company philosophy page
        run: python scripts/validate_about.py

      - name: Validate Production Core CORS contract
        shell: bash
        run: |
          set -euo pipefail

          preflight() {
            local path="$1"
            local request_headers="$2"
            local request_method="$3"
            local headers body status origin methods allowed
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              --request OPTIONS "https://api.lotbiai.com${path}" \
              --header 'Origin: https://lotbiai.com' \
              --header "Access-Control-Request-Method: ${request_method}" \
              --header "Access-Control-Request-Headers: ${request_headers}")"
            [[ "$status" == '204' ]] || { echo "${path}: expected CORS 204, got $status" >&2; cat "$body" >&2; exit 1; }
            origin="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            methods="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-methods:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            allowed="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-headers:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            [[ "$origin" == 'https://lotbiai.com' ]] || { echo "${path}: unexpected ACAO '$origin'" >&2; exit 1; }
            grep -Eiq "(^|,)[[:space:]]*${request_method}([[:space:]]*,|$)" <<<"$methods" || { echo "${path}: ${request_method} missing from ACAM '$methods'" >&2; exit 1; }
            for required in ${request_headers//,/ }; do
              grep -Eiq "(^|,)[[:space:]]*${required}([[:space:]]*,|$)" <<<"$allowed" || { echo "${path}: $required missing from ACAH '$allowed'" >&2; exit 1; }
            done
          }

          preflight '/v2/conversation/messages' 'authorization,content-type' 'POST'
          preflight '/v2/conversation/guest/sessions' 'content-type' 'POST'
          preflight '/v2/conversation/guest/messages' 'content-type,idempotency-key,x-lotbi-guest-token' 'POST'
          preflight '/v2/product-resolutions/search' 'authorization,content-type' 'POST'
          preflight '/v2/product-resolutions/prs_smoke/cards' 'authorization' 'GET'
          preflight '/v2/product-resolutions/prs_smoke/review' 'authorization,content-type' 'POST'
          preflight '/v2/public/product-cards/search' '' 'GET'
          preflight '/v2/sessions/handoffs/redeem' 'content-type' 'POST'
          preflight '/v2/me' 'authorization' 'GET'
          preflight '/v2/sessions/logout' 'authorization' 'POST'

          evil_status="$(curl --silent --show-error --output /tmp/evil-body --write-out '%{http_code}' \
            --request OPTIONS 'https://api.lotbiai.com/v2/conversation/messages' \
            --header 'Origin: https://evil.example' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          [[ "$evil_status" == '403' ]] || { echo "evil origin expected 403, got $evil_status" >&2; cat /tmp/evil-body >&2; exit 1; }

          unauth_headers="$(mktemp)"
          unauth_status="$(curl --silent --show-error --output /tmp/unauth-body --dump-header "$unauth_headers" --write-out '%{http_code}' \
            --request POST 'https://api.lotbiai.com/v2/conversation/messages' \
            --header 'Origin: https://lotbiai.com' \
            --header 'Content-Type: application/json' \
            --data '{"text":"site-review-unauthenticated-probe"}')"
          [[ "$unauth_status" == '401' ]] || { echo "unauthenticated conversation expected 401, got $unauth_status" >&2; cat /tmp/unauth-body >&2; exit 1; }
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://lotbiai\.com' "$unauth_headers" || { echo 'unauthenticated response missing exact ACAO' >&2; exit 1; }

      - name: Static serving smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/lotbi-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lotbi-site-http.log || true
            exit 1
          fi

