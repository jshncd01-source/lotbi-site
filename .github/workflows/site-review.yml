      # SUBWAY-LIFE-INFO-P0: 지역정보 → 지하철 정보 → 역. 챗 0건, 가까운 역(위치
      # 설정이 켜진 경우만), 역 검색, 호선·방향, 서울시 실시간 도착(공식 문구·생성
      # 시각·막차·열차 위치), 과거 평균 혼잡도(실시간 아님 표기), 새로고침·뒤로가기
      # 복원을 360·375·390·412·1280, 라이트·다크에서 실제 탭으로 확인한다. Core는
      # Core 코드가 만든 응답(scripts/fixtures/subway_life_info_p0_01.json).
      - name: Validate subway info (지역정보 · 지하철 정보)
