name: Public Site Review Gate

on:
  push:
    branches:
      - site-public-02-review
      - site-home-chat-01-review
      - site-public-hardening-01-review
      - site-home-nav-01-review
      - site-chat-runtime-01-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate public site
        run: python scripts/validate_site.py

      - name: Validate conversational home foundation
        run: python scripts/validate_home_chat.py

      - name: Validate public-site hardening
        run: python scripts/validate_hardening.py

      - name: Validate accessibility contracts
        run: python scripts/validate_accessibility.py

      - name: Validate chat runtime readiness
        run: python scripts/validate_chat_runtime.py

      - name: Test chat runtime security boundary
        run: node --test tests/site-chat-runtime-01.test.mjs

      - name: Build static site for server/edge host
        run: node scripts/build-vercel-static.mjs

      - name: Static serving smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/lotbi-site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          for path in / /privacy.html /terms.html /account-deletion.html /contact.html /robots.txt /sitemap.xml /home-chat.css /site-hardening.css /home-shell.js; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done
