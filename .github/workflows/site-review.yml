      # EV-CHARGER-NEARBY-LIST-P0: 지역정보 → 전기차 충전소는 대화가 아니라 자체 목록 화면
      # (공공데이터 가까운 순, 급속·완속·충전 가능·반경, 저장한 지도앱 아이콘·링크, 전화 버튼 없음,
