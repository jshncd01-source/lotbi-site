name: Profile Menu Side Review

on:
  push:
    branches:
      - site-profile-menu-improvement-01-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate profile contracts
        run: node scripts/validate_conversation_sidebar_ux_01.mjs

      - name: Validate desktop and 390px profile runtime
        run: node scripts/validate_profile_menu_improvement_01.mjs
