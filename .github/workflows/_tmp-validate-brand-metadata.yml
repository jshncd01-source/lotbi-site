name: Temporary LOTBI browser metadata focused validation

on:
  push:
    branches:
      - site-favicon-brand-metadata-prod-hotfix-01-work

permissions:
  contents: write

jobs:
  validate-brand-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-favicon-brand-metadata-prod-hotfix-01-work
          fetch-depth: 0

      - name: Validate title, social metadata, manifest and icon binaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct

          title = "LOTBI | 검색부터 예약·구매·일정까지, 당신의 일상을 실행하는 AI"
          description = "말하면 알아듣고, 기억하고, 검색부터 예약·구매·일정까지 필요한 일을 이어서 실행하는 AI Life Agent, LOTBI."
          version = "20260920-life-agent1"

          html = Path("index.html").read_text(encoding="utf-8")
          expected_once = [
              f'<title>{title}</title>',
              f'<meta name="description" content="{description}" />',
              f'<meta property="og:title" content="{title}" />',
              f'<meta property="og:description" content="{description}" />',
              f'<meta name="twitter:title" content="{title}" />',
              f'<meta name="twitter:description" content="{description}" />',
              f'<link rel="icon" href="/favicon.ico?v={version}" sizes="any" />',
              f'<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v={version}" />',
              f'<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v={version}" />',
              f'<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v={version}" />',
              f'<link rel="manifest" href="/site.webmanifest?v={version}" />',
          ]
          for needle in expected_once:
              count = html.count(needle)
              assert count == 1, (needle, count)

          assert 'https://lotbiai.com/assets/lotbi-og-share.png' in html
          assert '대화형 AI 커머스 경험' not in html
          assert 'AI Voice Commerce Agent 경험을 준비' not in html

          manifest = json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))
          assert manifest["name"] == title
          assert manifest["short_name"] == "LOTBI"
          assert manifest["description"] == description
          assert manifest["start_url"] == "/"
          assert manifest["scope"] == "/"
          icons = {(x["sizes"], x["src"], x["type"]) for x in manifest["icons"]}
          assert ("192x192", f"/icon-192.png?v={version}", "image/png") in icons
          assert ("512x512", f"/icon-512.png?v={version}", "image/png") in icons

          expected_pngs = {
              "favicon-16x16.png": (16, 16),
              "favicon-32x32.png": (32, 32),
              "apple-touch-icon.png": (180, 180),
              "icon-192.png": (192, 192),
              "icon-512.png": (512, 512),
          }
          for path, expected in expected_pngs.items():
              data = Path(path).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == expected, (path, width, height)

          ico = Path("favicon.ico").read_bytes()
          reserved, kind, count = struct.unpack("<HHH", ico[:6])
          assert (reserved, kind) == (0, 1)
          sizes = set()
          for i in range(count):
              off = 6 + i * 16
              w, h = ico[off], ico[off + 1]
              sizes.add((256 if w == 0 else w, 256 if h == 0 else h))
          for required in {(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)}:
              assert required in sizes, (required, sizes)

          print("LOTBI browser metadata focused validation: GREEN")
          PY

      - name: Static icon and manifest serving smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/lotbi-brand-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          for path in / /favicon.ico /favicon-16x16.png /favicon-32x32.png /apple-touch-icon.png /icon-192.png /icon-512.png /site.webmanifest; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done

      - name: Remove temporary focused validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-validate-brand-metadata.yml
          git commit -m "chore(site): remove temporary brand metadata validator"
          git push origin HEAD:site-favicon-brand-metadata-prod-hotfix-01-work
