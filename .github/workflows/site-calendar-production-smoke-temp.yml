name: TEMP Calendar Production Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/validate_calendar_production_smoke_01.mjs'
      - '.github/workflows/site-calendar-production-smoke-temp.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployed Calendar entry in Chromium
        run: node scripts/validate_calendar_production_smoke_01.mjs
