name: Legal Pages Review Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - privacy.html
      - terms.html
      - scripts/sync_footer_business_info.py
      - scripts/validate_legal_pages.py
      - scripts/emit_social_signup_legal_manifest.py
      - .github/workflows/legal-pages-review.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-legal-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Production legal pages
        run: python scripts/validate_legal_pages.py

      # 전자상거래법 제10조 표시사항은 페이지마다 하드코딩되어 있어 한 곳만
      # 고쳐지고 나머지가 뒤처지기 쉽다. 실제로 이메일과 전화번호가 그렇게 빠졌다.
      - name: Validate footer business information is identical across pages
        run: python scripts/sync_footer_business_info.py --check

      - name: Validate public-site structure
        run: python scripts/validate_site.py

      - name: Validate public-site hardening
        run: python scripts/validate_hardening.py

      - name: Validate accessibility contracts
        run: python scripts/validate_accessibility.py

      - name: Emit reviewed Social Signup legal manifest values
        run: python scripts/emit_social_signup_legal_manifest.py
