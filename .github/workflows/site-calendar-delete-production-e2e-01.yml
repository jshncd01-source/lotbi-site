name: TEMP Calendar Delete Production E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/validate_calendar_delete_production_e2e_01.mjs'
      - '.github/workflows/site-calendar-delete-production-e2e-01.yml'

permissions:
  contents: read

jobs:
  production-delete-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Production Calendar delete confirmation in Chromium
        run: node scripts/validate_calendar_delete_production_e2e_01.mjs
