name: TEMP Calendar Production Visual Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/calendar-production-visual-evidence-temp.yml'
      - 'scripts/validate_calendar_production_visual_temp.mjs'

permissions:
  contents: read

jobs:
  production-calendar-visual:
    name: Actual Production Calendar visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Actual Production Calendar Chromium geometry
        run: node scripts/validate_calendar_production_visual_temp.mjs

      - name: Upload Production Calendar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-calendar-visual-evidence
          path: production-calendar-evidence
          if-no-files-found: warn
          retention-days: 7
