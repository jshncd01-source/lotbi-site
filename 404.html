  <!-- SITE-STATIC-PAGES-THEME-01 — same pre-paint bootstrap as index.html, and
       for the same reasons: inline, blocking, above every stylesheet. These
       pages load no module, so this script is the ONLY thing that puts the
       theme on the document. site-static-theme.css keys entirely on the
       attribute it sets.
       Reads only. Wrapped in try/catch and does nothing on a bad or missing
       value: a storage failure must not stop a legal page from rendering. -->
  <script>
    try {
      var lotbiSavedTheme = window.localStorage.getItem('lotbi.site.theme.bootstrap.v1');
      if (lotbiSavedTheme === 'light' || lotbiSavedTheme === 'dark' || lotbiSavedTheme === 'system') {
        document.documentElement.dataset.siteThemeBootstrap = lotbiSavedTheme;
      }
    } catch (error) {}
  </script>
