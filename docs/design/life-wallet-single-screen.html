<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Life Wallet 개별 시안</title>
  <style>
    *{box-sizing:border-box}:root{--blue:#1677ff;--ink:#10244a;--muted:#63718a;--line:#dce4ef;--pale:#eaf3ff}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f7faff,#eaf1f9);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
    button{font:inherit}.screen{overflow:hidden;background:#fff;box-shadow:0 22px 70px rgba(37,61,96,.15)}
    .desktop.screen{width:1120px;height:780px;border:1px solid #cfd9e7;border-radius:28px}.mobile.screen{width:390px;height:820px;border:1px solid #cfd9e7;border-radius:32px}
    .tag{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e6ecf4;background:#f9fbfe;font-size:13px;font-weight:850}.tag small{color:#75839a}
    .desktop-layout{height:calc(100% - 44px);display:grid;grid-template-columns:190px 1fr}.sidebar{padding:28px 17px;border-right:1px solid #e6ecf3}.brand{font-size:28px;font-weight:950;color:#183d76}.brand b{color:var(--blue)}.nav{display:grid;gap:8px;margin-top:34px}.nav div{padding:12px;border-radius:10px;font-size:13px}.nav .on{background:#eef2f7;font-weight:850}
    .content{padding:30px 42px}.heading{display:flex;align-items:start;justify-content:space-between}.heading h1{margin:0;font-size:31px;letter-spacing:-.045em}.subtitle{margin:6px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}.action{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:800}.action.primary{border-color:var(--blue);background:var(--blue);color:#fff}
    .gate{width:565px;margin:34px auto 0;padding:34px 42px 42px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 14px 42px rgba(32,53,82,.08);text-align:center}.mark{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 22px;border-radius:50%;background:var(--pale);color:var(--blue);font-size:32px}.gate h2{margin:0;font-size:28px;letter-spacing:-.04em}.gate p{margin:11px 0 23px;color:var(--muted);font-size:15px;line-height:1.6}.dots{display:flex;justify-content:center;gap:22px;margin-bottom:22px}.dots i{width:18px;height:18px;border:2px solid #14223b;border-radius:50%}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.key{height:60px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:17px;font-weight:780}.key.open{border-color:var(--blue);background:var(--blue);color:#fff}
    .mobile-body{height:calc(100% - 44px);padding:24px 20px;background:#fff}.appbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.appbar strong{font-size:21px}.appbar span{width:24px;font-size:22px}.mobile-title h1{margin:0;font-size:27px;letter-spacing:-.04em}.mobile .subtitle{font-size:12px}.mobile .gate{width:100%;margin:14px 0 0;padding:10px 0 0;border:0;box-shadow:none}.mobile .mark{width:68px;height:68px;margin-bottom:18px}.mobile .gate h2{font-size:22px}.mobile .gate p{margin:9px 0 18px;font-size:13px}.mobile .dots{gap:19px;margin-bottom:18px}.mobile .dots i{width:16px;height:16px}.mobile .keypad{gap:9px}.mobile .key{height:55px;font-size:16px}.safe{margin-top:20px;color:var(--muted);font-size:11px;text-align:center;line-height:1.5}.bio .gate{padding-top:25px}.bio .mark{font-size:29px}.bio-primary,.bio-secondary{width:100%;height:54px;border-radius:11px;font-weight:850}.bio-primary{margin-top:6px;border:0;background:var(--blue);color:#fff}.bio-secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.or{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}.or:before,.or:after{content:"";height:1px;flex:1;background:var(--line)}.security{margin-top:24px;padding:13px;border-radius:12px;background:#f5f8fc;color:var(--muted);font-size:11px;line-height:1.55}.android .mobile-body{border-top:4px solid #28364b}.ios .mobile-body{border-top:4px solid #111}
    .filters{display:flex;justify-content:center;gap:8px;margin:24px 0 15px}.filter{padding:9px 16px;border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:750}.filter.on{border-color:var(--blue);background:var(--blue);color:#fff}.deck{width:520px;height:330px;position:relative;margin:0 auto}.card{position:absolute;left:50%;width:460px;height:220px;transform:translateX(-50%);overflow:hidden;border:1px solid rgba(19,43,76,.12);border-radius:16px;box-shadow:0 10px 28px rgba(34,63,99,.15)}.peek{height:64px;padding:12px 19px;font-size:13px;font-weight:850}.p1{top:0;background:#e9eff9}.p2{top:34px;background:#e5f4ef}.p3{top:68px;background:#fff1d4}.p4{top:102px;background:#173e75;color:#fff}.front{top:136px;height:215px;padding:18px;background:linear-gradient(135deg,#f7fbff,#dcecff)}.front h3{margin:0 0 14px;font-size:21px}.masked{display:grid;grid-template-columns:108px 1fr;gap:18px}.avatar{height:125px;border-radius:11px;background:linear-gradient(#dbe9f8,#acc9e8)}.lines{display:grid;gap:9px;padding-top:10px}.lines i{height:9px;border-radius:10px;background:#abc2dc}.deck-meta{text-align:center;margin-top:88px}.deck-meta .hint{color:var(--muted);font-size:12px}.deck-meta h2{margin:6px 0 2px;font-size:20px}.deck-meta small{color:var(--muted)}.detail{width:300px;height:40px;display:grid;place-items:center;margin:10px auto 0;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;font-weight:850}.life-info{margin:24px auto 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc}.life-info strong{font-size:13px}.life-line{display:flex;justify-content:space-between;margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff;font-size:11px}
    .mobile .heading h1{font-size:27px}.mobile .actions .action:not(.primary){display:none}.mobile .action{height:40px;padding:0 12px}.mobile .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 14px}.mobile .filter{padding:8px 3px;text-align:center}.mobile .deck{width:100%;height:290px}.mobile .card{width:100%;height:190px}.mobile .peek{height:58px}.mobile .p2{top:31px}.mobile .p3{top:62px}.mobile .p4{top:93px}.mobile .front{top:124px;height:190px;padding:15px}.mobile .front h3{font-size:18px}.mobile .masked{grid-template-columns:80px 1fr;gap:13px}.mobile .avatar{height:105px}.mobile .deck-meta{margin-top:73px}.mobile .detail{width:100%}.mobile .life-info{margin-top:18px}
  </style>
</head>
<body><main id="app"></main>
<script>
  const params=new URLSearchParams(location.search);const platform=params.get('platform')||'desktop-web';const state=params.get('state')||'lock';
  const names={'desktop-web':['Desktop Web','1440px+'],'mobile-web':['Mobile Web','360–430px'],android:['Android App','Material'],ios:['iPhone App','iOS']};
  const isDesktop=platform==='desktop-web';const isApp=platform==='android'||platform==='ios';const app=document.getElementById('app');
  const tag=`<div class="tag"><span>${names[platform][0]}</span><small>${names[platform][1]}</small></div>`;
  const sidebar=`<aside class="sidebar"><div class="brand">L<b>O</b>TBI</div><div class="nav"><div>＋ 새 대화</div><div>▣ 캘린더</div><div class="on">▰ Life Wallet</div><div>◇ 사기·피싱 확인</div><div>◎ 분쟁·사고 도우미</div><div>⌂ 지역정보</div></div></aside>`;
  const heading=`<div class="heading"><div><h1>Life Wallet</h1><p class="subtitle">내 생활자료를 안전하게 보관해요.</p></div>${state==='wallet'?'<div class="actions"><button class="action primary">＋ '+(isDesktop?'자료 추가':'추가')+'</button><button class="action">▣ 잠그기</button><button class="action">⚙ 설정</button></div>':''}</div>`;
  const pin=`<div class="gate"><div class="mark">▣</div><h2>PIN을 입력해 주세요</h2><p>등록한 자료를 안전하게 보려면 4자리 PIN을 입력하세요.</p><div class="dots"><i></i><i></i><i></i><i></i></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','지움','0','열기'].map(x=>`<div class="key ${x==='열기'?'open':''}">${x}</div>`).join('')}</div>${isDesktop?'':'<div class="safe">◇ PIN은 저장하거나 전송하지 않습니다.</div>'}</div>`;
  const bioLabel=platform==='ios'?'Face ID':'생체 인증';const bioIcon=platform==='ios'?'⌗':'◎';const bio=`<div class="gate"><div class="mark">${bioIcon}</div><h2>${bioLabel}으로 열기</h2><p>${platform==='ios'?'Face ID로 본인 확인 후':'등록한 지문 또는 얼굴로'}<br>Life Wallet을 열어 주세요.</p><button class="bio-primary">${bioIcon}　${bioLabel} 시작</button><div class="or">또는</div><button class="bio-secondary">PIN으로 열기</button><div class="security">◇ ${platform==='ios'?'얼굴정보는 iPhone Secure Enclave 밖으로 나오지 않으며':'생체정보는 Android 기기에서만 확인하며'} LOTBI로 전송하지 않습니다.</div></div>`;
  const wallet=`<div class="filters"><span class="filter on">전체</span><span class="filter">신분증</span><span class="filter">명함</span><span class="filter">증명서·문서</span><span class="filter">기타</span></div><div class="deck"><div class="card peek p1">명함</div><div class="card peek p2">자격증</div><div class="card peek p3">증명서</div><div class="card peek p4">여권</div><div class="card front"><h3>자동차운전면허증</h3><div class="masked"><div class="avatar"></div><div class="lines"><i></i><i></i><i></i><i></i><i></i></div></div></div></div><div class="deck-meta"><div class="hint">↕ 위아래로 넘겨보세요</div><h2>운전면허증</h2><small>4 / 5</small><div class="detail">상세 보기</div></div><div class="life-info"><strong>생활정보</strong><div class="life-line"><span>▣ 개인통관고유부호</span><span>P******** ›</span></div><div class="life-line"><span>⌁ 와이파이</span><span>LOTBI_Guest　******** ›</span></div></div>`;
  if(isDesktop){app.className='screen desktop';app.innerHTML=tag+`<div class="desktop-layout">${sidebar}<section class="content">${heading}${state==='lock'?pin:wallet}</section></div>`}
  else{app.className=`screen mobile ${platform} ${isApp&&state==='lock'?'bio':''}`;const top=isApp?(state==='lock'?`<div class="appbar"><span>‹</span><strong>Life Wallet</strong><span></span></div>`:''):(state==='lock'?`<div class="mobile-title">${heading}</div>`:'');app.innerHTML=tag+`<section class="mobile-body">${top}${state==='lock'?(isApp?bio:pin):heading+wallet}</section>`}
</script></body></html>
