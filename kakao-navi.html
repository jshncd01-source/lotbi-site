<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>카카오내비 연결 · LOTBI</title>
  <link rel="stylesheet" href="site-theme-tokens.css?v=aset-4c425187fe29">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--lotbi-surface,#f7f8fb);color:var(--lotbi-text-primary,#17191d);font-family:system-ui,-apple-system,sans-serif}
    main{box-sizing:border-box;width:min(92vw,420px);padding:24px;border:1px solid var(--lotbi-border-default,#d9dde5);border-radius:20px;background:var(--lotbi-surface-elevated,#fff);box-shadow:0 12px 32px rgb(12 27 52/.12)}
    h1{font-size:20px;margin:0 0 8px}p{line-height:1.55;margin:0 0 18px;color:var(--lotbi-text-secondary,#4d535d)}
    button,a{box-sizing:border-box;min-height:44px;border-radius:12px;font-weight:700;font-size:15px}
    button{width:100%;border:0;background:#f7c843;color:#2d260f;padding:11px 16px}
    a{display:block;margin-top:10px;text-align:center;padding:11px 16px;color:inherit}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1>카카오내비로 연결할게요</h1>
    <p id="status" role="status" aria-live="polite">공식 카카오내비 연결을 준비하고 있어요.</p>
    <button id="launch" type="button" hidden>카카오내비에서 길안내 시작</button>
    <a href="/" rel="noopener">LOTBI로 돌아가기</a>
  </main>
  <script type="module" src="site-kakao-navi-handoff.js?v=aset-4c425187fe29"></script>
</body>
</html>
