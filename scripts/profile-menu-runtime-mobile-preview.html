<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LOTBI profile menu mobile runtime preview</title>
  <style>
    html,body{margin:0;background:#eef1f6;font-family:system-ui,sans-serif}
    body{padding:16px}
    iframe{display:block;width:390px;height:844px;border:0;background:#fff}
    pre{max-width:390px;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <iframe id="mobile-frame" title="LOTBI profile menu mobile validation" src="./profile-menu-runtime-preview.html?embedded=1"></iframe>
  <pre id="profile-result">pending</pre>
  <script>
    const frame=document.getElementById('mobile-frame');
    const out=document.getElementById('profile-result');
    const timer=setInterval(()=>{
      try{
        const child=frame.contentDocument?.getElementById('profile-result');
        if(child&&child.textContent&&child.textContent!=='pending'){
          const value=JSON.parse(child.textContent);
          if(value?.viewport?.width!==390){value.ok=false;value.error='mobile iframe viewport width '+value?.viewport?.width}
          if(value?.viewport?.height!==844){value.ok=false;value.error='mobile iframe viewport height '+value?.viewport?.height}
          if(value?.viewport?.mobile!==true){value.ok=false;value.error='mobile media query was not active'}
          out.textContent=JSON.stringify(value);
          clearInterval(timer);
        }
      }catch(error){
        out.textContent=JSON.stringify({ok:false,error:String(error?.stack||error)});
        clearInterval(timer);
      }
    },25);
    setTimeout(()=>{if(out.textContent==='pending'){out.textContent=JSON.stringify({ok:false,error:'mobile fixture timeout'});clearInterval(timer)}},7000);
  </script>
</body>
</html>
