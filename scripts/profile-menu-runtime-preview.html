<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LOTBI profile menu runtime preview</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../home-chat.css">
  <link rel="stylesheet" href="../site-sidebar-nav.css">
  <link rel="stylesheet" href="../site-auth-continuity.css">
  <link rel="stylesheet" href="../site-conversation.css" data-site-conversation-styles>
</head>
<body class="chat-home-page">
  <main id="root"><div data-sidebar-account></div></main>
  <pre id="profile-result">pending</pre>
  <script type="module">
    const root = document.getElementById('root');
    const out = document.getElementById('profile-result');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const wait = async (fn, label) => {
      for (let i = 0; i < 120; i += 1) {
        if (fn()) return;
        await sleep(25);
      }
      throw new Error('timeout ' + label);
    };
    const click = node => node.dispatchEvent(new MouseEvent('click', {bubbles: true, cancelable: true, view: window}));
    const storedState = () => JSON.parse(localStorage.getItem('lotbi.site.ux.v1.threads.install-profile-test') || '{}');
    const counts = {me: 0, subscription: 0, logout: 0, other: 0};

    window.fetch = async input => {
      const url = String(typeof input === 'string' ? input : input?.url || '');
      if (url.endsWith('/v2/me')) {
        counts.me += 1;
        return new Response(JSON.stringify({
          user: {id: 'usr', name: '홍길동', account_handle: 'hong'},
          session: {id: 'ses', assurance_level: 'FULL', expires_at: '2099-01-01T00:00:00Z'},
          installation: {id: 'install-profile-test'},
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      if (url.endsWith('/v2/subscription')) {
        counts.subscription += 1;
        return new Response(JSON.stringify({
          plan: 'LOTBI_PLUS',
          status: 'ACTIVE',
          entitled: true,
          free_units: 3,
          used_free_units: 1,
          remaining_free_units: 2,
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      if (url.endsWith('/v2/sessions/logout')) {
        counts.logout += 1;
        return new Response(JSON.stringify({session_id: 'ses', status: 'REVOKED'}), {
          status: 200,
          headers: {'Content-Type': 'application/json'},
        });
      }
      counts.other += 1;
      return new Response('{}', {status: 500});
    };

    try {
      localStorage.clear();
      const continuity = await import('../site-continuity.js?profile-preview=1');
      const conversation = await import('../site-conversation.js?profile-preview=1');

      continuity.markAnonymousAccountUi();
      const anonymousEntry = document.querySelector('[data-sidebar-account] a.sidebar-account-entry');
      if (
        !(anonymousEntry instanceof HTMLAnchorElement)
        || anonymousEntry.getAttribute('href') !== '/auth/start/'
        || document.querySelector('[data-profile-menu-trigger]')
      ) throw new Error('anonymous contract');

      root.innerHTML = '<aside class="chat-sidebar"><ul data-recent-conversations></ul><div class="sidebar-account-footer"><div class="sidebar-account-slot" data-sidebar-account></div></div></aside><main class="chat-home-shell"><div data-home-avatar-anchor><div data-lotbi-avatar-container class="chat-character-wrap"><span class="chat-character-logo">LOTBI</span></div></div><div id="conversation-thread" class="conversation-thread" hidden></div><textarea id="lotbi-prompt" class="chat-input"></textarea><button class="send-button" type="button">전송</button><button class="mic-button" type="button">마이크</button><p id="chat-status"></p><div id="chat-state-region" hidden></div></main>';
      document.body.dataset.siteAuthState = 'authenticated';

      if (!conversation.mountConversation({sessionToken: 'site-token', identityKey: 'install-profile-test'})) {
        throw new Error('mount');
      }

      await wait(() => document.querySelector('.sidebar-account-name')?.textContent === '홍길동', 'name');
      await wait(() => document.querySelector('.sidebar-account-handle')?.textContent === '@hong', 'handle');
      await wait(() => counts.subscription === 1, 'subscription');

      const prompt = document.getElementById('lotbi-prompt');
      const send = document.querySelector('.send-button');
      prompt.value = '안녕';
      prompt.dispatchEvent(new Event('input', {bubbles: true}));
      click(send);
      await wait(() => storedState().threads?.[0]?.messages?.length === 2, 'conversation');

      prompt.value = '작성 중인 초안';
      prompt.dispatchEvent(new Event('input', {bubbles: true}));
      const before = storedState();
      const initialUrl = location.href;
      const threadId = before.activeThreadId;
      const messages = JSON.stringify(before.threads[0].messages);

      let trigger = document.querySelector('[data-profile-menu-trigger]');
      if (!(trigger instanceof HTMLButtonElement) || trigger.hasAttribute('href')) throw new Error('authenticated trigger');

      click(trigger);
      await wait(() => document.querySelector('.profile-popover'), 'open');
      if (
        location.href !== initialUrl
        || document.querySelector('.profile-popover-summary-name')?.textContent !== '홍길동'
        || document.querySelector('.profile-popover-summary-handle')?.textContent !== '@hong'
        || document.querySelector('.profile-popover-summary-plan')?.textContent !== 'LOTBI_PLUS'
      ) throw new Error('profile summary/url');

      const labels = [...document.querySelectorAll('.profile-popover [role="menuitem"]')].map(node => node.textContent).join('|');
      if (labels !== '프로필|개인 맞춤 설정|설정|도움말|로그아웃' || counts.logout !== 0) {
        throw new Error('menu/logout-before-click');
      }

      let after = storedState();
      if (
        after.activeThreadId !== threadId
        || after.draft !== '작성 중인 초안'
        || prompt.value !== '작성 중인 초안'
        || JSON.stringify(after.threads[0].messages) !== messages
      ) throw new Error('continuity open');

      click(trigger);
      await wait(() => !document.querySelector('.profile-popover'), 'toggle close');

      trigger = document.querySelector('[data-profile-menu-trigger]');
      click(trigger);
      await wait(() => document.querySelector('.profile-popover-layer'), 'outside setup');
      click(document.querySelector('.profile-popover-layer'));
      await wait(() => !document.querySelector('.profile-popover'), 'outside close');

      trigger = document.querySelector('[data-profile-menu-trigger]');
      click(trigger);
      await wait(() => document.querySelector('.profile-popover'), 'escape setup');
      document.querySelector('.profile-popover').dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Escape',
        bubbles: true,
        cancelable: true,
      }));
      await wait(() => !document.querySelector('.profile-popover'), 'escape close');

      const slot = document.querySelector('[data-sidebar-account]');
      slot.innerHTML = '<a class="sidebar-account-entry" href="/auth/start/">로그인</a>';
      const stale = slot.querySelector('a');
      const staleClick = new MouseEvent('click', {bubbles: true, cancelable: true, view: window});
      stale.dispatchEvent(staleClick);
      await wait(() => slot.querySelector('[data-profile-menu-trigger]') && document.querySelector('.profile-popover'), 'self heal');

      after = storedState();
      if (
        !staleClick.defaultPrevented
        || location.href !== initialUrl
        || after.activeThreadId !== threadId
        || after.draft !== '작성 중인 초안'
        || JSON.stringify(after.threads[0].messages) !== messages
        || counts.logout !== 0
      ) throw new Error('stale self-heal continuity');

      const measured = document.querySelector('.profile-popover').getBoundingClientRect();
      const rect = {
        width: measured.width,
        left: measured.left,
        right: measured.right,
        top: measured.top,
        bottom: measured.bottom,
      };
      const expectedWidth = innerWidth <= 900 ? Math.max(0, innerWidth - 20) : 264;
      if (
        rect.left < -1 || rect.right > innerWidth + 1 || rect.top < -1 || rect.bottom > innerHeight + 1
        || Math.abs(rect.width - expectedWidth) > 3
      ) throw new Error('popover viewport/layout');

      const logout = [...document.querySelectorAll('.profile-popover [role="menuitem"]')]
        .find(node => node.textContent === '로그아웃');
      click(logout);
      await wait(() => counts.logout === 1, 'logout');
      await wait(() => document.querySelector('[data-sidebar-account] a[href="/auth/start/"]'), 'logout UI');

      out.textContent = JSON.stringify({
        ok: true,
        viewport: {width: innerWidth, height: innerHeight, mobile: innerWidth <= 900},
        anonymousEntry: true,
        profile: {name: '홍길동', handle: '@hong', plan: 'LOTBI_PLUS'},
        continuity: {
          urlUnchanged: location.href === initialUrl,
          threadId,
          draft: after.draft,
          messageCount: after.threads[0].messages.length,
        },
        close: {toggle: true, outside: true, escape: true},
        selfHeal: true,
        counts,
        popover: {
          width: rect.width,
          left: rect.left,
          right: rect.right,
          top: rect.top,
          bottom: rect.bottom,
        },
      });
    } catch (error) {
      out.textContent = JSON.stringify({ok: false, error: String(error?.stack || error), counts});
    }
  </script>
</body>
</html>
